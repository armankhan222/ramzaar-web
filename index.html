<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RAMZAAR — Custom Furniture &amp; Home Furnishing Studio</title>
    <meta
      name="description"
      content="RAMZAAR creates custom furniture and home furnishings designed around your space, dimensions and way of living."
    />
    <meta name="theme-color" content="#202223" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph (TODO: use absolute URLs + a raster social card once the domain is final) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RAMZAAR" />
    <meta property="og:title" content="RAMZAAR — Custom Furniture &amp; Home Furnishing Studio" />
    <meta
      property="og:description"
      content="Custom furniture and home furnishings designed around your space, dimensions and way of living. Serving Mumbai · Thane · Navi Mumbai."
    />
    <meta property="og:image" content="/images/placeholders/hero.svg" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Hero image is fetched before the app bundle executes -->
    <link rel="preload" as="image" href="/images/placeholders/hero.svg" fetchpriority="high" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "RAMZAAR",
        "slogan": "Made Around You.",
        "description": "RAMZAAR creates custom furniture and home furnishings designed around your space, dimensions and way of living. Custom sofas, upholstery, curtains, cushions, beds and chairs — made to measure.",
        "areaServed": ["Mumbai", "Thane", "Navi Mumbai"],
        "knowsAbout": [
          "Custom furniture",
          "Custom sofas",
          "Upholstery",
          "Curtains",
          "Cushions",
          "Beds",
          "Chairs"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
