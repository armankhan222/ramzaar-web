<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="Placeholder illustration: sofa frame under construction — timber rails, joints and webbing">
  <defs>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#F4F0E7" opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1200" height="900" fill="#2A2C2E"/>
  <rect width="1200" height="900" fill="url(#dots)"/>

  <!-- trestle -->
  <g stroke="#F4F0E7" stroke-opacity="0.55" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M160 700 L200 300 M240 700 L200 300"/>
    <path d="M960 700 L1000 300 M1040 700 L1000 300"/>
    <line x1="120" y1="700" x2="280" y2="700"/>
    <line x1="920" y1="700" x2="1080" y2="700"/>
  </g>

  <!-- frame: back rail, seat rails, arms -->
  <g stroke="#F4F0E7" stroke-opacity="0.85" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <rect x="300" y="260" width="600" height="46"/>
    <rect x="300" y="470" width="600" height="40"/>
    <rect x="300" y="560" width="600" height="40"/>
    <rect x="266" y="260" width="40" height="340"/>
    <rect x="894" y="260" width="40" height="340"/>
    <rect x="330" y="330" width="540" height="24"/>
  </g>

  <!-- joints -->
  <g stroke="#C8A875" stroke-width="2" fill="none">
    <path d="M300 260 l40 46 M340 260 l-40 46"/>
    <path d="M860 260 l40 46 M900 260 l-40 46"/>
    <circle cx="200" cy="300" r="6"/>
    <circle cx="1000" cy="300" r="6"/>
  </g>

  <!-- webbing straps -->
  <g stroke="#F4F0E7" stroke-opacity="0.45" stroke-width="2">
    <line x1="340" y1="580" x2="320" y2="490"/>
    <line x1="440" y1="580" x2="428" y2="490"/>
    <line x1="540" y1="580" x2="534" y2="490"/>
    <line x1="640" y1="580" x2="640" y2="490"/>
    <line x1="740" y1="580" x2="746" y2="490"/>
    <line x1="840" y1="580" x2="854" y2="490"/>
  </g>

  <!-- clamped corner -->
  <circle cx="306" cy="600" r="9" fill="#C8A875"/>

  <g stroke="#C8A875" stroke-width="1.5" opacity="0.75" fill="none">
    <path d="M28 44 V28 H44"/>
    <path d="M1156 28 H1172 V44"/>
    <path d="M1172 856 V872 H1156"/>
    <path d="M44 872 H28 V856"/>
