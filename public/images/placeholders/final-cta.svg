<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="Placeholder illustration: warm evening living room — sofa, rug and pendant light, wide elevation">
  <defs>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#F4F0E7" opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="#2A2C2E"/>
  <rect width="1920" height="1080" fill="url(#dots)"/>

  <!-- glow -->
  <circle cx="960" cy="420" r="300" fill="#C8A875" fill-opacity="0.05"/>

  <!-- floor -->
  <line x1="140" y1="860" x2="1780" y2="860" stroke="#F4F0E7" stroke-opacity="0.28" stroke-width="2"/>
