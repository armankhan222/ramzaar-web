  <g stroke="#C8A875" stroke-width="1.5" opacity="0.75" fill="none">
    <path d="M28 44 V28 H44"/>
    <path d="M1876 28 H1892 V44"/>
    <path d="M1892 1036 V1052 H1876"/>
    <path d="M44 1052 H28 V1036"/>
